name: Auto Unzip Files

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract ZIP files
        shell: bash
        run: |
          set -e

          found=false

          while IFS= read -r -d '' zip; do
            found=true

            echo "Extracting: $zip"

            unzip -o "$zip" -d .

            rm -f "$zip"

          done < <(
            find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              -print0
          )

          if [ "$found" = false ]; then
            echo "No ZIP files found."
          else
            echo "ZIP extraction completed."
          fi

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: auto update"
          git push
